[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leela_pytorch_impl"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11",
    "iceberg>=0.4",
    "numpy",
    "pandas",
    "torch>=2.11",
]

[tool.setuptools.packages.find]
where = ["."]
